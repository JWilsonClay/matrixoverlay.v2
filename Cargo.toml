[package]
name = "matrix-overlay"
version = "0.1.1"
edition = "2021"

[dependencies]
xcb = { version = "1.2", features = ["randr", "shape", "render", "xinput", "shm"] }
cairo-rs = { version = "0.18", features = ["xcb", "png"] }
pangocairo = "0.18"
pango = "0.18"
sysinfo = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tray-icon = "0.8"
gtk = "0.16"
anyhow = "1.0"
thiserror = "1.0"
env_logger = "0.10"
log = "0.4"
crossbeam-channel = "0.5"
simplelog = "0.12"
git2 = "0.18"
ollama-rs = "0.1"
self_update = "0.39"
sha2 = "0.10"
notify-rust = "4.11"
rand = "0.8"
libc = "0.2"

# Optional dependencies for features
reqwest = { version = "0.11", features = ["blocking", "json"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }

[features]
default = ["weather"]
weather = ["tokio", "reqwest"]

[dev-dependencies]
# [2.9 probe, round-8] Test-only. Lets the MRC call `gtk::init()` so the
# cargo-test process holds the same GTK/Pango font-map state the overlay does.
# Same version as the main dependency, so it is the same crate instance.
gtk = "0.16"
tempfile = "3.10"
mockito = "1.4"
criterion = "0.5"

[[bench]]
name = "render_bench"
harness = false

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
